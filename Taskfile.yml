version: '3'

vars:
  # Build tags for optional features (e.g., TAGS=pkcs11 for hardware signer support)
  TAGS: '{{.TAGS | default ""}}'
  BUILD_FLAGS: '{{if .TAGS}}-tags={{.TAGS}}{{end}}'

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  # --------------------------------------------------------------------------
  # Go
  # --------------------------------------------------------------------------
  build:
    desc: Build the signet Go binaries
    cmds:
      - go build {{.BUILD_FLAGS}} -o signet ./cmd/signet
      - go build {{.BUILD_FLAGS}} -o signet-git ./cmd/signet-git

  test:
    desc: Run Go unit tests
    cmds:
      - go test -v {{.BUILD_FLAGS}} ./...

  fmt:
    desc: Format Go code (gofumpt)
    cmds:
      - gofumpt -w .

  lint:
    desc: Run Go linters
    cmds:
      - golangci-lint run ./...

  security:
    desc: Run Go security scan
    cmds:
      - gosec ./...

  install:
    desc: Install signet binaries to /usr/local/bin
    deps: [build]
    cmds:
      - sudo cp signet /usr/local/bin/
      - sudo cp signet-git /usr/local/bin/
      - echo "Installed signet and signet-git"

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -f signet signet-git
      - rm -rf /tmp/signet-test-*
      - rm -rf /tmp/verify-test*
      - rm -rf /tmp/test-verify*
      - rm -rf /tmp/gitsign-test

  # --------------------------------------------------------------------------
  # Docker / Integration
  # --------------------------------------------------------------------------
  docker-build:
    desc: Build Docker test image
    cmds:
      - docker build -t signet-test -f scripts/testing/Dockerfile.test .

  docker-test:
    desc: Run integration tests in Docker
    deps: [docker-build]
    cmds:
      - docker run --rm signet-test

  docker-shell:
    desc: Interactive shell in test container
    deps: [docker-build]
    cmds:
      - docker run --rm -it -v "{{.ROOT_DIR}}:/workspace" -w /workspace signet-test bash

  integration-test:
    desc: Run integration test in Docker
    deps: [docker-build]
    cmds:
      - docker run --rm signet-test

  # --------------------------------------------------------------------------
  # Release
  # --------------------------------------------------------------------------
  verify-release:
    desc: Verify a published release's checksums + signature bundles (TAG=vX.Y.Z)
    # Single source for the release promotion gate (signet-cf2adc). Promotion
    # workflows and operators invoke THIS target — never re-implement the
    # checks inline (taskfile-ci-parity).
    preconditions:
      - sh: test -n "{{.TAG}}"
        msg: "TAG is required: task verify-release TAG=v0.3.0"
    cmds:
      - ./scripts/release/verify_release.sh {{.TAG}} {{.CLI_ARGS}}

  # --------------------------------------------------------------------------
  # Combined
  # --------------------------------------------------------------------------
  # Rust CMS signing has moved to ley-line-open's `leyline-sign` crate
  # (LLO `rs/ll-open/sign/`). The former `rs/crates/sign/` fork was dropped
  # under bead signet-d583bd (chore: drop rs/crates/sign fork, depend on
  # LLO's leyline-sign). Consumers should build/test the crate via LLO's
  # workspace.
  all:
    desc: Build and test everything (Go)
    cmds:
      - task: build
      - task: test

  quick:
    desc: Clean, rebuild, and integration test
    cmds:
      - task: clean
      - task: build
      - task: integration-test
