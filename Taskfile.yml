version: '3'

vars:
  # Build tags for optional features (e.g., TAGS=pkcs11 for hardware signer support)
  TAGS: '{{.TAGS | default ""}}'
  BUILD_FLAGS: '{{if .TAGS}}-tags={{.TAGS}}{{end}}'

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  # --------------------------------------------------------------------------
  # Go
  # --------------------------------------------------------------------------
  build:
    desc: Build the signet Go binaries
    cmds:
      - go build {{.BUILD_FLAGS}} -o signet ./cmd/signet
      - go build {{.BUILD_FLAGS}} -o signet-git ./cmd/signet-git

  test:
    desc: Run Go unit tests
    cmds:
      - go test -v {{.BUILD_FLAGS}} ./...

  fmt:
    desc: Format Go code (gofumpt)
    cmds:
      - gofumpt -w .

  lint:
    desc: Run Go linters
    cmds:
      - golangci-lint run ./...

  security:
    desc: Run Go security scan
    cmds:
      - gosec ./...

  install:
    desc: Install signet binaries to /usr/local/bin
    deps: [build]
    cmds:
      - sudo cp signet /usr/local/bin/
      - sudo cp signet-git /usr/local/bin/
      - echo "Installed signet and signet-git"

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -f signet signet-git
      - rm -rf /tmp/signet-test-*
      - rm -rf /tmp/verify-test*
      - rm -rf /tmp/test-verify*
      - rm -rf /tmp/gitsign-test

  # --------------------------------------------------------------------------
  # Docker / Integration
  # --------------------------------------------------------------------------
  docker-build:
    desc: Build Docker test image
    cmds:
      - docker build -t signet-test -f scripts/testing/Dockerfile.test .

  docker-test:
    desc: Run integration tests in Docker
    deps: [docker-build]
    cmds:
      - docker run --rm signet-test

  docker-shell:
    desc: Interactive shell in test container
    deps: [docker-build]
    cmds:
      - docker run --rm -it -v "{{.ROOT_DIR}}:/workspace" -w /workspace signet-test bash

  integration-test:
    desc: Run integration test in Docker
    deps: [docker-build]
    cmds:
      - docker run --rm signet-test

  # --------------------------------------------------------------------------
  # Release
  # --------------------------------------------------------------------------
  release:build:
    desc: Build one release binary (PLATFORM=linux-amd64 GOOS=linux GOARCH=amd64 [DIR=.])
    # release.yml's build matrix invokes THIS — it does not re-implement the
    # go build line. That is what makes a release build reproducible locally:
    #   task release:build PLATFORM=linux-amd64 GOOS=linux GOARCH=amd64
    preconditions:
      - sh: test -n "{{.PLATFORM}}" && test -n "{{.GOOS}}" && test -n "{{.GOARCH}}"
        msg: "PLATFORM, GOOS and GOARCH are required (e.g. PLATFORM=linux-amd64 GOOS=linux GOARCH=amd64)"
    env:
      CGO_ENABLED: "0"
      GOOS: '{{.GOOS}}'
      GOARCH: '{{.GOARCH}}'
    cmds:
      - go build -trimpath -o {{.DIR | default "."}}/signet-{{.PLATFORM}} ./cmd/signet/

  release:build-all:
    desc: Build every release platform locally (DIR=dist by default)
    # The whole matrix on one machine. CI cannot run this — it fans out across
    # runners — but it is how you reproduce a release build without CI at all.
    vars:
      DIR: '{{.DIR | default "dist"}}'
    cmds:
      - mkdir -p {{.DIR}}
      - task: release:build
        vars: {PLATFORM: darwin-arm64, GOOS: darwin, GOARCH: arm64, DIR: '{{.DIR}}'}
      - task: release:build
        vars: {PLATFORM: linux-amd64, GOOS: linux, GOARCH: amd64, DIR: '{{.DIR}}'}
      - task: release:build
        vars: {PLATFORM: linux-arm64, GOOS: linux, GOARCH: arm64, DIR: '{{.DIR}}'}

  release:checksums:
    desc: Generate checksums-sha256.txt over the built binaries (DIR=release-assets)
    # release.yml invokes THIS rather than inlining sha256sum, so the checksum
    # file a verifier checks is produced by the same code path locally and in
    # CI. Uses shasum when sha256sum is absent (macOS) — the CI-only inline
    # version silently did not.
    vars:
      DIR: '{{.DIR | default "release-assets"}}'
    dir: '{{.DIR}}'
    cmds:
      - |
        if command -v sha256sum >/dev/null; then
          sha256sum signet-* > checksums-sha256.txt
        else
          shasum -a 256 signet-* > checksums-sha256.txt
        fi
      - cat checksums-sha256.txt

  release:dry-run:
    desc: Reproduce a release build locally through the signing boundary (no authority)
    # Everything a release does EXCEPT the parts that need a GitHub Actions
    # OIDC token: build all platforms, checksum them, and build the KMS plugin
    # that would do the signing. Exercises every step signet owns, so a CI
    # outage or an authority outage does not block debugging the release path.
    vars:
      DIR: '{{.DIR | default "dist"}}'
    cmds:
      - task: release:build-all
        vars: {DIR: '{{.DIR}}'}
      - task: release:checksums
        vars: {DIR: '{{.DIR}}'}
      - go build -trimpath -o {{.DIR}}/sigstore-kms-signet ./cmd/sigstore-kms-signet
      - |
        echo
        echo "Local dry-run complete in {{.DIR}}/"
        echo "  Built:     $(ls {{.DIR}}/signet-* | tr '\n' ' ')"
        echo "  Checksums: {{.DIR}}/checksums-sha256.txt"
        echo "  Signer:    {{.DIR}}/sigstore-kms-signet"
        echo
        echo "NOT exercised locally: enrollment + signing. Those need a GitHub"
        echo "Actions OIDC token, which only exists inside a workflow run."
        echo "Verify a PUBLISHED release instead with: task verify-release TAG=<tag>"

  verify-release:
    desc: Verify a published release's checksums + signature bundles (TAG=vX.Y.Z)
    # Single source for the release promotion gate (signet-cf2adc). Promotion
    # workflows and operators invoke THIS target — never re-implement the
    # checks inline (taskfile-ci-parity).
    preconditions:
      - sh: test -n "{{.TAG}}"
        msg: "TAG is required: task verify-release TAG=v0.3.0"
    cmds:
      - ./scripts/release/verify_release.sh {{.TAG}} {{.CLI_ARGS}}

  # --------------------------------------------------------------------------
  # Combined
  # --------------------------------------------------------------------------
  # Rust CMS signing has moved to ley-line-open's `leyline-sign` crate
  # (LLO `rs/ll-open/sign/`). The former `rs/crates/sign/` fork was dropped
  # under bead signet-d583bd (chore: drop rs/crates/sign fork, depend on
  # LLO's leyline-sign). Consumers should build/test the crate via LLO's
  # workspace.
  all:
    desc: Build and test everything (Go)
    cmds:
      - task: build
      - task: test

  quick:
    desc: Clean, rebuild, and integration test
    cmds:
      - task: clean
      - task: build
      - task: integration-test
