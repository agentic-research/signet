name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.2.0)'
        required: true
        type: string

permissions: {}

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            goos: darwin
            goarch: arm64
            platform: darwin-arm64
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            platform: linux-amd64
          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            platform: linux-arm64

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ env.TAG }}

      - name: Install Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Install Task
        uses: arduino/setup-task@24c5e13bce349197642746563945fcdf9355e8f4 # v2.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Invokes the Taskfile target, never an inline go build — so this exact
      # build is reproducible with `task release:build` locally, and a CI
      # outage does not make the release path undebuggable (taskfile-ci-parity).
      - name: Build signet binary
        run: |
          task release:build \
            PLATFORM=${{ matrix.platform }} \
            GOOS=${{ matrix.goos }} \
            GOARCH=${{ matrix.goarch }}

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signet-${{ matrix.platform }}
          path: signet-${{ matrix.platform }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # The Signet Action exchanges this OIDC token for a short-lived Notme
      # certificate. No master key or long-lived signing secret is stored.
      id-token: write
    steps:
      - name: Checkout the tagged Signet Action source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ env.TAG }}

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Install Task
        uses: arduino/setup-task@24c5e13bce349197642746563945fcdf9355e8f4 # v2.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Same target as `task release:checksums DIR=release-assets` locally.
      - name: Generate checksums
        run: task release:checksums DIR=release-assets

      # Sign every published artifact through the standard signet:// KMS URI,
      # then VERIFY WHAT WE JUST SIGNED before creating the release.
      #
      # checksums-sha256.txt already gave integrity — you can tell whether a
      # download matches what the file says. It gives no AUTHENTICITY: anyone
      # who can replace the binaries can replace the checksums alongside them.
      # The Action turns this workflow's OIDC identity into a five-minute Notme
      # signing certificate and keeps the matching key only in runner memory.
      #
      # signet is the identity component — its binaries are what other systems
      # here trust to establish identity — so an unsigned release is the worst
      # artifact in the set to leave unattested.
      - name: Sign + verify release artifacts
        uses: ./.github/actions/sign-artifact
        with:
          artifacts: |
            release-assets/signet-darwin-arm64
            release-assets/signet-linux-amd64
            release-assets/signet-linux-arm64
            release-assets/checksums-sha256.txt
          # Operators can point this at https://<cloister-host>/identity to
          # make the issuing CA the cluster-local notme-identity authority.
          authority-url: ${{ vars.SIGNET_AUTHORITY_URL || 'https://auth.notme.bot' }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2
        with:
          tag_name: ${{ env.TAG }}
          generate_release_notes: true
          # EVERY release publishes as a GitHub prerelease, and no release
          # ever self-promotes to "latest". This is deliberate and permanent,
          # not a first-release quirk: publication is Phase 1/2 of the
          # promotion pipeline; production status is Phase 3, an explicit
          # human step AFTER `task verify-release TAG=<tag>` passes from a
          # clean machine:
          #   gh release edit <tag> --prerelease=false --latest
          # Forgetting the flip leaves the release visibly marked
          # "Pre-release" — a loud state, not a silent one.
          # (Goal Zero promotion plan, docs/release/goal-zero-promotion.md,
          # bead signet-cf2adc; contradiction fix: signet-ee1f3b.)
          prerelease: true
          make_latest: "false"
          # DRAFT, then publish as a separate step below.
          #
          # This repository has immutable releases. A published release cannot
          # accept new assets — GitHub rejects the upload with "Cannot upload
          # asset ... to an immutable release". Because this action publishes
          # BEFORE uploading, a non-draft release here produces a published,
          # permanently EMPTY release that can never be fixed: PATCH returns
          # "state cannot be changed when release is immutable". That is
          # exactly how v0.3.0-rc.3 was lost.
          #
          # Creating a draft lets every asset attach first; publishing then
          # seals the complete set in one irreversible step. It also matches
          # the promotion model, where publication is a deliberate act rather
          # than a side effect of uploading.
          draft: true
          # Includes each .sigstore.json bundle, leaf cert, CA bundle, and
          # ephemeral public key beside the signed artifact.
          files: release-assets/*

      # Seals the release with all assets attached. Immutability begins here,
      # so anything not uploaded above is not in this release, permanently.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          echo "published $TAG with assets:"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[].name'
